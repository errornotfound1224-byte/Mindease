<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindEase</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="home" class="auth-logo">
                    <span class="logo">🧠</span>
                    <span class="brand-name">MindEase</span>
                </a>
                <h1>Welcome to MindEase</h1>
                <p>Sign in to continue your wellness journey</p>
            </div>

            <div style="background: var(--primary-lavender); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center;">
                <p style="margin: 0; font-size: 0.95rem; color: var(--text-dark);">
                    🎯 Track your focus • ✅ Build habits • 📈 See your progress
                </p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autofocus>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="form-error" id="formError"></div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
                <p style="margin-top: 1rem;">
                    <a href="home" style="color: var(--text-secondary); font-size: 0.9rem;">← Learn about MindEase</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
