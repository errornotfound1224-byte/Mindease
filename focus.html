<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer - MindEase</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-logo"><span class="logo">🧠</span><span class="brand-name">MindEase</span></a>
                <button class="sidebar-toggle" id="sidebarToggle">×</button>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
                <a href="assessment.html" class="nav-item"><span class="nav-icon">📝</span><span class="nav-text">Assessment</span></a>
                <a href="wellness-plan.html" class="nav-item"><span class="nav-icon">💡</span><span class="nav-text">Wellness Plan</span></a>
                <a href="habits.html" class="nav-item"><span class="nav-icon">✅</span><span class="nav-text">Habit Tracker</span></a>
                <a href="focus.html" class="nav-item active"><span class="nav-icon">⏱️</span><span class="nav-text">Focus Timer</span></a>
                <a href="progress.html" class="nav-item"><span class="nav-icon">📈</span><span class="nav-text">Progress</span></a>
                <a href="resources.html" class="nav-item"><span class="nav-icon">📚</span><span class="nav-text">Resources</span></a>
                <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-text">Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-secondary btn-sm btn-block">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="mobile-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
                <div class="mobile-brand">MindEase</div>
            </div>

            <div class="content-container">
                <div class="page-header">
                    <h1>Focus Timer</h1>
                    <p class="page-subtitle">Work in focused intervals using the Pomodoro Technique</p>
                </div>

                <div class="card">
                    <div class="card-body" style="text-align: center; padding: 3rem;">
                        <div id="timerDisplay" style="font-size: 5rem; font-weight: 700; color: var(--primary-purple); margin-bottom: 2rem; font-family: monospace;">
                            25:00
                        </div>
                        
                        <div id="timerControls" style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap;">
                            <button id="startBtn" class="btn btn-primary btn-lg">Start</button>
                            <button id="pauseBtn" class="btn btn-secondary btn-lg" style="display: none;">Pause</button>
                            <button id="resumeBtn" class="btn btn-primary btn-lg" style="display: none;">Resume</button>
                            <button id="resetBtn" class="btn btn-secondary btn-lg" style="display: none;">Reset</button>
                        </div>
                        
                        <div id="timerStatus" style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem;">
                            Ready to start your focus session
                        </div>
                        
                        <div style="display: flex; gap: 2rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap;">
                            <div>
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Focus Duration (minutes)</label>
                                <input type="number" id="focusDuration" value="25" min="1" max="120" 
                                       style="padding: 0.75rem; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem; width: 100px; text-align: center;">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Break Duration (minutes)</label>
                                <input type="number" id="breakDuration" value="5" min="1" max="30" 
                                       style="padding: 0.75rem; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem; width: 100px; text-align: center;">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Today's Sessions</h2>
                    </div>
                    <div class="card-body" id="todaySessions">
                        <div class="loading-state">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Statistics</h2>
                    </div>
                    <div class="card-body" id="statistics">
                        <div class="loading-state">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/focus.js"></script>
</body>
</html>
